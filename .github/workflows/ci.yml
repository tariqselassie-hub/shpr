name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: "--features avx2"
          - os: macos-latest
            target: aarch64-apple-darwin
            flags: "--features neon"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            flags: "--features avx2"

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run Tests
        run: cargo test --lib ${{ matrix.flags }}

      - name: Run Demo Benchmark
        run: cargo run --release --bin shpr_demo
